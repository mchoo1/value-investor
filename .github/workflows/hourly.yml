name: "Every 2 hours: Claude results and urgent alerts"
on:
  workflow_dispatch:
  schedule:
    - cron: "37 */2 * * *"   # every 2 hours at :37

concurrency:
  group: valueinvestor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-jobs.txt
      - run: pip install -r requirements-jobs.txt
      - name: Load Claude's results
        run: python tools/inbox.py
      - name: Load checked-in files (inbox-seed, each loaded once)
        run: python tools/inbox.py --dir inbox-seed
      - name: Read stock ideas sent to the Telegram bot (/add TICKER note)
        id: ideas
        run: python tools/ideas.py telegram
      - name: Research new ideas and hand them to tonight's deep dive
        if: steps.ideas.outputs.new_ideas == 'true'
        run: python tools/research.py --requested && python tools/monitor.py export
      - name: Push new research to Telegram (with links to the reports)
        run: python tools/notify.py research
      - name: Send Telegram alerts
        run: python tools/notify.py alerts
      - name: Send today's brief if the 07:07 run did not
        run: python tools/notify.py catchup
      - name: Tell Ming if this job failed
        if: failure()
        run: python tools/notify.py jobfail "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
