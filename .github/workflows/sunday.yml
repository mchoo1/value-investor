name: "Sunday headlines (08:07 SGT) and digest (18:07 SGT)"
on:
  workflow_dispatch:
  schedule:
    - cron: "7 0 * * 0"   # 08:07 SGT Sunday: headlines
    - cron: "7 10 * * 0"   # 18:07 SGT Sunday: digest

concurrency:
  group: valueinvestor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-jobs.txt
      - run: pip install -r requirements-jobs.txt
      - name: Load Claude's results
        run: python tools/inbox.py
      - name: Weekly headlines for Claude to tag
        if: github.event.schedule != '7 10 * * 0'
        run: python tools/monitor.py weekly && python tools/monitor.py export
      - name: Weekly digest
        if: github.event.schedule == '7 10 * * 0'
        run: python tools/notify.py digest
