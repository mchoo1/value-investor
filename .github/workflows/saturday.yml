name: "Saturday screen, research and headlines (06:07 SGT), summary (08:07 SGT)"
on:
  workflow_dispatch:
  schedule:
    - cron: "7 22 * * 5"   # 06:07 SGT Saturday: screen, research, headlines
    - cron: "7 0 * * 6"   # 08:07 SGT Saturday: Telegram summary

concurrency:
  group: valueinvestor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-jobs.txt
      - run: pip install -r requirements-jobs.txt
      - name: Weekly screen
        if: github.event.schedule != '7 0 * * 6'
        run: python tools/screen.py
      - name: Research (Watchlist, Book, candidates, requests, top 10)
        if: github.event.schedule != '7 0 * * 6'
        run: python tools/research.py
      - name: Weekly headlines for Claude to tag
        if: github.event.schedule != '7 0 * * 6'
        run: python tools/monitor.py weekly
      - name: Hand data to Claude's tasks
        if: github.event.schedule != '7 0 * * 6'
        run: python tools/monitor.py export
      - name: Heartbeat (screen and research finished)
        if: github.event.schedule != '7 0 * * 6'
        run: python tools/heartbeat.py screen && python tools/heartbeat.py research
      - name: Telegram screen summary
        if: github.event.schedule == '7 0 * * 6'
        run: python tools/notify.py screen
      - name: Tell Ming if this job failed
        if: failure()
        run: python tools/notify.py jobfail "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
