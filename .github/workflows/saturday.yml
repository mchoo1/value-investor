name: "Saturday screen and research (08:07 SGT)"
on:
  workflow_dispatch:
  schedule:
    - cron: "7 0 * * 6"   # 08:07 SGT Saturday

concurrency:
  group: valueinvestor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-jobs.txt
      - run: pip install -r requirements-jobs.txt
      - name: Weekly screen
        run: python tools/screen.py
      - name: Research (Watchlist, Book, candidates, requests, top 10)
        run: python tools/research.py
      - name: Hand data to Claude's tasks
        run: python tools/monitor.py export
      - name: Telegram screen summary
        run: python tools/notify.py screen
